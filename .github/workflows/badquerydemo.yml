name: BadQueryDemo

# Only runs for changes touching this app's subdirectory.
on:
  push:
    branches: [ main ]
    paths:
      - 'BadQueryDemo/**'
      - '.github/workflows/badquerydemo.yml'
  pull_request:
    paths:
      - 'BadQueryDemo/**'
      - '.github/workflows/badquerydemo.yml'
  workflow_dispatch:

jobs:
  build:
    runs-on: macos-15
    defaults:
      run:
        working-directory: BadQueryDemo

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Select latest stable Xcode
        uses: maxim-lobanov/setup-xcode@v1
        with:
          xcode-version: latest-stable

      - name: Show toolchain
        run: |
          xcodebuild -version
          xcode-select -p

      - name: Build (unsigned)
        run: |
          xcodebuild \
            -project BadQueryDemo.xcodeproj \
            -scheme BadQueryDemo \
            -configuration Release \
            -sdk iphoneos \
            -derivedDataPath build \
            CODE_SIGNING_ALLOWED=NO \
            CODE_SIGNING_REQUIRED=NO \
            CODE_SIGN_IDENTITY="" \
            build

      - name: Package unsigned IPA
        run: |
          set -euo pipefail
          APP_PATH="$(find build/Build/Products/Release-iphoneos -maxdepth 1 -name '*.app' | head -1)"
          echo "Packaging: $APP_PATH"
          rm -rf Payload BadQueryDemo.ipa
          mkdir -p Payload
          cp -R "$APP_PATH" Payload/
          zip -qr BadQueryDemo.ipa Payload
          ls -lh BadQueryDemo.ipa

      - name: Upload unsigned IPA
        uses: actions/upload-artifact@v4
        with:
          name: BadQueryDemo-unsigned-ipa
          path: BadQueryDemo/BadQueryDemo.ipa
          if-no-files-found: error

      - name: Upload raw .app
        uses: actions/upload-artifact@v4
        with:
          name: BadQueryDemo-app
          path: BadQueryDemo/build/Build/Products/Release-iphoneos/*.app
          if-no-files-found: error
